<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Portal Kalender Shooting — Taqwa</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#1f8f3a;--gd:#0f6b2a;--lime:#a6d63c;--ink:#1c2b1f;--card:#fff;--muted:#5d6b61;--pink:#d6246e;--sky1:#3a9bec;--sky2:#bfe4fb;--line:#e3ece5;--soft:#f1f8ee;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2) 360px,var(--g) 360px);min-height:100%;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}
.logo{display:block;width:max-content;margin:0 auto;background:#fff;border-radius:0 0 26px 26px;padding:10px 28px 12px;text-align:center;box-shadow:0 6px 18px #0002}.logo img{display:block;width:190px;max-width:55vw;height:auto}
.logo b{font:800 34px/1 'Baloo 2';color:var(--g)}.logo small{display:block;font-size:9px;color:#444}
.hero{text-align:center;padding:18px 0 22px}
.pill{display:inline-block;background:var(--lime);color:var(--gd);font-weight:600;font-size:12px;padding:4px 16px;border-radius:10px}
h1{font:800 clamp(30px,7vw,54px)/.98 'Baloo 2';color:var(--lime);margin:10px 0 2px;text-transform:uppercase;-webkit-text-stroke:6px var(--gd);paint-order:stroke fill;text-shadow:0 4px 0 var(--gd)}
.sub{font:700 clamp(16px,3.6vw,22px) 'Baloo 2';color:#fff;-webkit-text-stroke:4px var(--gd);paint-order:stroke fill}
.land{background:var(--g);border-radius:50% 50% 0 0/30px 30px 0 0;padding:28px 0 60px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:10px 6px;text-align:center;box-shadow:0 4px 0 #0002}
.stat b{display:block;font:800 clamp(26px,6vw,38px)/1 'Baloo 2';color:var(--pink)}.stat span{font-size:11px;color:var(--muted)}
.banner{background:#fff3c4;color:#5a4300;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:none}.banner.on{display:block}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 5px 0 #0002;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar h3,.nav h3{font:800 21px 'Baloo 2';margin:0}.nav{display:flex;gap:6px;align-items:center}.nav h3{min-width:150px;text-align:center}
button,select{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:8px 14px;background:var(--soft);cursor:pointer;font-weight:600;font-size:13px}.btn.g{background:var(--g);color:#fff}.btn.p{background:var(--pink);color:#fff}.btn.sm{padding:6px 11px}
select{border:2px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:13px}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:3px 0}
.day{min-height:84px;background:var(--soft);border-radius:10px;padding:4px;cursor:pointer;overflow:hidden}.day.o{opacity:.4}.day.t{outline:3px solid var(--pink)}.day.s{background:#dff3c9;box-shadow:inset 0 0 0 2px var(--g)}
.day>i{font-style:normal;font-size:12px;font-weight:600}
.ev{display:block;width:100%;text-align:left;border:0;color:#fff;border-radius:6px;font-size:10px;padding:2px 4px;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;color:#fff;border-radius:10px;padding:2px 9px;white-space:nowrap}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}td{padding:9px 8px;border-top:1px solid var(--line)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}
.muted{color:var(--muted);font-size:12px}.empty{color:var(--muted);font-size:13px;padding:8px 0}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.on{display:flex}
.box{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:560px;max-height:92%;overflow:auto}
.box h3{font:800 22px 'Baloo 2';color:var(--g);margin:0 0 8px}.kv{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.kv b{min-width:84px;color:var(--muted);font-weight:500}.kv span{flex:1;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:14px;font-size:13px;display:none;z-index:30;max-width:90%}
@media(max-width:560px){.wrap{padding:0 12px}h1{-webkit-text-stroke:5px var(--gd)}.sub{-webkit-text-stroke:3px var(--gd)}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.panel{padding:12px;border-radius:18px}.bar{flex-direction:column;align-items:stretch}.nav{justify-content:space-between}.nav h3{min-width:0;flex:1}.btn{min-height:40px}.flt select{flex:1;min-width:40%}.day{min-height:52px;padding:3px;text-align:center}.day>i{display:block}.ev{display:inline-block;width:8px;height:8px;padding:0;margin:3px 1px 0;border-radius:50%;font-size:0}.hm{display:none}.modal{align-items:flex-end;padding:0}.box{border-radius:22px 22px 0 0;max-width:none}}
</style></head><body>
